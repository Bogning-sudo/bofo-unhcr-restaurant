<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Commande – BOFO UNHCR Restaurant</title>
  <style>
    :root { --green:#176b45; --gold:#f3b61f; --cream:#fffaf0; --ink:#222; --muted:#666; }
    * { box-sizing:border-box; }
    body { margin:0; font-family:Arial,sans-serif; color:var(--ink); background:var(--cream); }
    header { padding:28px 18px; color:white; text-align:center; background:linear-gradient(135deg,#176b45,#0d452c); }
    header h1 { margin:0 0 6px; font-size:1.8rem; }
    header p { margin:0; opacity:.9; }
    main { max-width:760px; margin:auto; padding:18px; }
    section { background:white; margin:0 0 16px; padding:18px; border-radius:16px; box-shadow:0 4px 18px #00000012; }
    h2 { color:var(--green); font-size:1.2rem; margin:0 0 14px; }
    .item { display:grid; grid-template-columns:1fr auto; gap:12px; align-items:center; padding:13px 0; border-bottom:1px solid #eee; }
    .item:last-child { border-bottom:0; }
    .item strong { display:block; }
    .desc { display:block; color:var(--muted); font-size:.88rem; margin-top:3px; }
    .price { color:var(--green); font-weight:bold; }
    input[type=number] { width:64px; padding:10px; border:1px solid #bbb; border-radius:9px; font-size:16px; }
    label.field { display:block; margin:12px 0; font-weight:bold; }
    label.field input, label.field textarea, label.field select { display:block; width:100%; margin-top:6px; padding:12px; border:1px solid #bbb; border-radius:9px; font-size:16px; background:white; }
    textarea { min-height:80px; resize:vertical; }
    .choice { display:flex; gap:18px; flex-wrap:wrap; margin:10px 0; }
    .choice label { font-weight:normal; }
    #deliveryFields { display:block; padding:10px 12px; background:#f5faf7; border-radius:10px; }
    .total { position:sticky; bottom:0; background:#fff; border:2px solid var(--gold); }
    .total-line { display:flex; justify-content:space-between; align-items:center; font-size:1.25rem; font-weight:bold; margin-bottom:13px; }
    button { width:100%; padding:15px; border:0; border-radius:11px; color:white; background:#25D366; font-size:1.05rem; font-weight:bold; cursor:pointer; }
    button:hover { filter:brightness(.95); }
    .copy { margin-top:9px; color:var(--green); background:#e9f6ef; border:1px solid #b9dfca; }
    .note { color:var(--muted); font-size:.82rem; text-align:center; margin:9px 0 0; }
    .error { color:#a01818; font-weight:bold; margin:0 0 10px; }
  </style>
</head>
<body>
  <header>
    <h1>BOFO UNHCR Restaurant</h1>
    <p>Commandez facilement depuis votre téléphone</p>
  </header>
  <main>
    <form id="orderForm">
      <section>
        <h2>🍲 Plats camerounais</h2>
        <div id="foods"></div>
      </section>

      <section>
        <h2>🥤 Boissons</h2>
        <div id="drinks"></div>
      </section>

      <section>
        <h2>👤 Vos informations</h2>
        <label class="field">Nom et prénom *<input id="customerName" required autocomplete="name" placeholder="Ex. Marie Ngoa"></label>
        <label class="field">Numéro de Pama *<input id="customerPhone" required inputmode="tel" autocomplete="tel" placeholder="Ex. 6 99 00 00 00"></label>
        <div id="deliveryFields">
          <p><strong>Lieu de livraison :</strong> bureaux de l’UNHCR à Bastos</p>
          <label class="field">Étage *<input id="floor" required placeholder="Ex. 2e étage"></label>
          <label class="field">Numéro du bureau *<input id="office" required placeholder="Ex. Bureau 214"></label>
        </div>
        <label class="field">Heure souhaitée<select id="time"><option>Dès que possible</option><option>Dans 30 minutes</option><option>Dans 1 heure</option><option>À préciser avec le restaurant</option></select></label>
        <label class="field">Mode de paiement<select id="payment"><option>Espèces</option><option>Orange Money</option><option>MTN MoMo</option><option>Paiement au retrait</option></select></label>
        <label class="field">Instructions particulières<textarea id="notes" placeholder="Sans piment, sauce à part, allergie…"></textarea></label>
      </section>

      <section class="total">
        <div id="error" class="error" aria-live="polite"></div>
        <div class="total-line"><span>Total estimé</span><span id="total">0 FCFA</span></div>
        <button type="submit">Envoyer la commande sur WhatsApp</button>
        <button type="button" class="copy" id="copyOrder">Copier la commande</button>
        <p class="note">La commande sera envoyée au restaurant pour confirmation.</p>
      </section>
    </form>
  </main>
  <script>
    const RESTAURANT_WHATSAPP = "33687081724";

    const products = [
      {cat:"foods", name:"Ndolé royal", desc:"Ndolé, viande, crevettes et plantain mûr", price:3500},
      {cat:"foods", name:"Poulet DG", desc:"Poulet, plantain mûr et légumes sautés", price:4500},
      {cat:"foods", name:"Eru et water fufu", desc:"Feuilles d'eru, waterleaf et accompagnement", price:4000},
      {cat:"foods", name:"Poisson braisé", desc:"Poisson entier, miondo et sauce piment", price:5000},
      {cat:"foods", name:"Koki et plantain", desc:"Gâteau de haricots et plantain", price:3000},
      {cat:"foods", name:"Riz sauté au poulet", desc:"Riz parfumé, légumes et poulet", price:3500},
      {cat:"foods", name:"Supplément plantain", desc:"Portion supplémentaire", price:1000},
      {cat:"foods", name:"Supplément miondo", desc:"4 bâtons", price:500},
      {cat:"drinks", name:"Eau minérale 50 cl", desc:"Bouteille fraîche", price:500},
      {cat:"drinks", name:"Jus de bissap", desc:"Fabrication maison, 33 cl", price:1000},
      {cat:"drinks", name:"Jus de gingembre", desc:"Fabrication maison, 33 cl", price:1000},
      {cat:"drinks", name:"Foléré", desc:"Boisson traditionnelle, 33 cl", price:1000},
      {cat:"drinks", name:"Coca-Cola / Fanta / Sprite", desc:"Bouteille 33 cl", price:800},
      {cat:"drinks", name:"Malta Guinness", desc:"Bouteille fraîche", price:1000}
    ];

    const money = n => new Intl.NumberFormat("fr-FR").format(n) + " FCFA";
    products.forEach((p,i) => {
      document.getElementById(p.cat).insertAdjacentHTML("beforeend", `
        <div class="item">
          <div><strong>${p.name}</strong><span class="desc">${p.desc}</span><span class="price">${money(p.price)}</span></div>
          <input class="qty" type="number" min="0" max="20" value="0" inputmode="numeric" aria-label="Quantité ${p.name}" data-index="${i}">
        </div>`);
    });

    function selectedItems() {
      return [...document.querySelectorAll(".qty")].map(el => ({...products[+el.dataset.index], qty:+el.value || 0})).filter(x => x.qty > 0);
    }
    function updateTotal() {
      const total = selectedItems().reduce((sum,p) => sum + p.price*p.qty, 0);
      document.getElementById("total").textContent = money(total);
    }
    document.querySelectorAll(".qty").forEach(el => el.addEventListener("input", updateTotal));
    function buildMessage() {
      const items = selectedItems();
      const error = document.getElementById("error");
      if (!items.length) { error.textContent = "Veuillez choisir au moins un article."; return null; }
      if (!document.getElementById("orderForm").reportValidity()) return null;
      error.textContent = "";
      const total = items.reduce((sum,p) => sum + p.price*p.qty, 0);
      const lines = items.map(p => `• ${p.qty} × ${p.name} — ${money(p.qty*p.price)}`);
      return `Bonjour, je souhaite passer cette commande :\n\n${lines.join("\n")}\n\n*Total estimé : ${money(total)}*\n\nNom : ${document.getElementById("customerName").value}\nNuméro de Pama : ${document.getElementById("customerPhone").value}\nLivraison : bureaux de l’UNHCR à Bastos\nÉtage : ${document.getElementById("floor").value}\nBureau : ${document.getElementById("office").value}\nHeure : ${document.getElementById("time").value}\nPaiement : ${document.getElementById("payment").value}\nInstructions : ${document.getElementById("notes").value || "Aucune"}\n\nMerci de confirmer la commande et le montant final.`;
    }

    document.getElementById("orderForm").addEventListener("submit", e => {
      e.preventDefault();
      const message = buildMessage();
      if (!message) return;
      window.location.href = `https://api.whatsapp.com/send?phone=${RESTAURANT_WHATSAPP}&text=${encodeURIComponent(message)}`;
    });

    document.getElementById("copyOrder").addEventListener("click", async () => {
      const message = buildMessage();
      if (!message) return;
      try {
        await navigator.clipboard.writeText(message);
        document.getElementById("error").style.color = "#176b45";
        document.getElementById("error").textContent = "Commande copiée. Ouvrez WhatsApp et collez-la dans la conversation du restaurant.";
      } catch (_) {
        window.prompt("Copiez la commande ci-dessous, puis collez-la dans WhatsApp :", message);
      }
    });
  </script>
</body>
</html>
