name: Actualiser le menu BOFO

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: write

concurrency:
  group: actualisation-menu-bofo
  cancel-in-progress: true

jobs:
  actualiser:
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Télécharger le menu Google Sheets
        shell: bash
        run: |
          curl --fail --location --retry 3 \
            "https://docs.google.com/spreadsheets/d/e/2PACX-1vRzJwGQWmbA-33P2UH75q9AkdivnjcpkVg5lzIyIABPd4PZmusae0KGPBASQRAv5KoCbEM3mXkIi9_J/pub?gid=91339212&single=true&output=csv&v=$(date +%s)" \
            --output menu.csv.nouveau
          test -s menu.csv.nouveau
          head -n 1 menu.csv.nouveau | grep -q "Date"
          mv menu.csv.nouveau menu.csv
          cp menu.csv menu.txt

      - name: Publier le menu actualisé
        shell: bash
        run: |
          git config user.name "BOFO Menu automatique"
          git config user.email "actions@users.noreply.github.com"
          git add menu.csv menu.txt

          if git diff --cached --quiet; then
            echo "Le menu est déjà à jour."
            exit 0
          fi

          git commit -m "Actualisation automatique du menu"
          git push
